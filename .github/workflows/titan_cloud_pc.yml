name: Titan Cloud PC 16GB Datacenter

on:
  workflow_dispatch:
    inputs:
      tunnel_provider:
        description: 'Tunnel Provider (tailscale or ngrok)'
        required: true
        default: 'tailscale'
      tunnel_token:
        description: 'Auth Token / Key (Tailscale Auth Key or Ngrok Token)'
        required: true
      session_hours:
        description: 'Session Duration in Hours'
        required: false
        default: '6'

jobs:
  run-cloud-pc:
    runs-on: windows-latest
    timeout-minutes: 360 # 6 hours maximum limit on GitHub Actions

    steps:
    - name: 1. Configure High-Performance Windows Cloud Environment
      run: |
        Write-Host "======================================================" -ForegroundColor Cyan
        Write-Host "  TITAN CLOUD WORKSTATION (MICROSOFT AZURE RUNNER)" -ForegroundColor Green
        Write-Host "  Allocated Hardware: 4 vCPUs / 16GB RAM / 256GB SSD" -ForegroundColor Yellow
        Write-Host "  Selected Tunnel Provider: ${{ github.event.inputs.tunnel_provider }}" -ForegroundColor Cyan
        Write-Host "======================================================" -ForegroundColor Cyan

    - name: 2. Enable Remote Desktop & Optimize for Low Bandwidth
      run: |
        # Enable RDP in Windows Registry
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        
        # Enable H.264 / AVC444 Hardware Codec for Low-Bandwidth Streaming (Egypt Quota Saver)
        reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" /v "SelectTransportProtocol" /t REG_DWORD /d 0 /f
        reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" /v "fEnableRemoteFX" /t REG_DWORD /d 1 /f
        reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" /v "RemoteFX_AVC444" /t REG_DWORD /d 1 /f
        
        # Update runneradmin password
        $Password = ConvertTo-SecureString "TitanCloud2026!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $Password -ErrorAction SilentlyContinue
        net user runneradmin "TitanCloud2026!"
        Write-Host "RDP Terminal Service Enabled on Port 3389 with H.264 Acceleration." -ForegroundColor Green

    # =========================================================================
    # OPTION A: TAILSCALE (100% FREE - NO CREDIT CARD - LOW LATENCY)
    # =========================================================================
    - name: 3A. Setup Tailscale Tunnel (Zero Credit Card)
      if: github.event.inputs.tunnel_provider == 'tailscale'
      run: |
        Write-Host "Installing Tailscale for Windows..." -ForegroundColor Cyan
        Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "tailscale-setup.exe"
        Start-Process -FilePath ".\tailscale-setup.exe" -ArgumentList "/quiet /norestart" -Wait
        Start-Sleep -Seconds 5

        $tailscalePath = "C:\Program Files\Tailscale\tailscale.exe"
        if (-not (Test-Path $tailscalePath)) {
            $tailscalePath = (Get-Command tailscale.exe -ErrorAction SilentlyContinue).Source
        }

        Write-Host "Authenticating with Tailscale Network..." -ForegroundColor Cyan
        $authKey = "${{ github.event.inputs.tunnel_token }}".Trim()
        & $tailscalePath up --authkey=$authKey --hostname=titan-cloud-pc --accept-routes
        Start-Sleep -Seconds 6

        $ip = (& $tailscalePath ip -4).Trim()
        if (-not $ip) {
            Write-Error "Failed to obtain Tailscale IPv4 address. Check if your Auth Key is valid."
            exit 1
        }

        Write-Host "======================================================" -ForegroundColor Green
        Write-Host ">>>TITAN_ENDPOINT_START<<<tcp://$($ip):3389>>>TITAN_ENDPOINT_END<<<" -ForegroundColor Green
        Write-Host "TITAN_PROVIDER: TAILSCALE (Low Ping Peer-to-Peer)" -ForegroundColor Cyan
        Write-Host "TITAN_IP: $ip" -ForegroundColor Yellow
        Write-Host "TITAN_USER: runneradmin" -ForegroundColor Yellow
        Write-Host "TITAN_PASS: TitanCloud2026!" -ForegroundColor Yellow
        Write-Host "======================================================" -ForegroundColor Green

        $info = @{
          endpoint = "tcp://$($ip):3389"
          provider = "tailscale"
          host = $ip
          port = "3389"
          username = "runneradmin"
          password = "TitanCloud2026!"
          specs = "16GB RAM / 4 vCPUs / 256GB SSD"
          status = "ONLINE"
        } | ConvertTo-Json
        $info | Out-File -FilePath "titan_connect.json" -Encoding utf8

    # =========================================================================
    # OPTION B: NGROK (FALLBACK - REQUIRES CREDIT CARD FOR TCP)
    # =========================================================================
    - name: 3B. Setup Ngrok Tunnel (Requires Credit Card on Ngrok)
      if: github.event.inputs.tunnel_provider == 'ngrok'
      run: |
        Write-Host "Downloading Ngrok v3 Engine..." -ForegroundColor Cyan
        Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip"
        Expand-Archive -Path "ngrok.zip" -DestinationPath "." -Force

        $cleanToken = "${{ github.event.inputs.tunnel_token }}".Trim()
        .\ngrok.exe config add-authtoken $cleanToken

        Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389 --log=stdout" -RedirectStandardOutput "ngrok.log" -RedirectStandardError "ngrok_err.log" -NoNewWindow
        Start-Sleep -Seconds 8

        $maxRetries = 10
        $retry = 0
        $publicUrl = $null
        while ($retry -lt $maxRetries -and -not $publicUrl) {
            try {
                $tunnels = (Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels" -TimeoutSec 3).tunnels
                if ($tunnels -and $tunnels.Count -gt 0) {
                    $publicUrl = $tunnels[0].public_url
                }
            } catch {
                Start-Sleep -Seconds 3
            }
            $retry++
        }

        if (-not $publicUrl) {
            Write-Error "Failed to extract Ngrok endpoint. Check logs below:"
            if (Test-Path "ngrok.log") { Get-Content "ngrok.log" }
            if (Test-Path "ngrok_err.log") { Get-Content "ngrok_err.log" }
            exit 1
        }

        Write-Host "======================================================" -ForegroundColor Cyan
        Write-Host ">>>TITAN_ENDPOINT_START<<<$publicUrl>>>TITAN_ENDPOINT_END<<<" -ForegroundColor Green
        Write-Host "TITAN_USER: runneradmin" -ForegroundColor Yellow
        Write-Host "TITAN_PASS: TitanCloud2026!" -ForegroundColor Yellow
        Write-Host "======================================================" -ForegroundColor Cyan

        $clean = $publicUrl -replace "tcp://",""
        $parts = $clean -split ":"
        $info = @{
          endpoint = $publicUrl
          provider = "ngrok"
          host = $parts[0]
          port = $parts[1]
          username = "runneradmin"
          password = "TitanCloud2026!"
          specs = "16GB RAM / 4 vCPUs / 256GB SSD"
          status = "ONLINE"
        } | ConvertTo-Json
        $info | Out-File -FilePath "titan_connect.json" -Encoding utf8

    # =========================================================================
    # COMMON: ARTIFACT & HEARTBEAT
    # =========================================================================
    - name: 4. Upload Connection Artifact for Titan Client App
      uses: actions/upload-artifact@v4
      with:
        name: titan-endpoint
        path: titan_connect.json
        retention-days: 1

    - name: 5. Keep Session Active (Up to 6 Hours)
      run: |
        Write-Host "Titan Cloud PC is now actively running in Microsoft Datacenter."
        Write-Host "Connect using Titan Desktop Client Application."
        $maxSeconds = 21600 # 6 hours
        $elapsed = 0
        while ($elapsed -lt $maxSeconds) {
          Start-Sleep -Seconds 60
          $elapsed += 60
          if ($elapsed % 600 -eq 0) {
            Write-Host "Cloud PC Heartbeat: $elapsed / $maxSeconds seconds elapsed."
          }
        }
