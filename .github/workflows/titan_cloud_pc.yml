name: Titan Cloud PC 16GB Datacenter (v0.11 M11 Enterprise Ultra)

on:
  workflow_dispatch:
    inputs:
      tunnel_provider:
        description: 'Tunnel Provider (tailscale, pinggy, or ngrok)'
        required: true
        default: 'tailscale'
      tunnel_token:
        description: 'Auth Token / Key (Tailscale Key, Ngrok Token, or empty for Pinggy)'
        required: false
        default: ''
      session_hours:
        description: 'Session Duration in Hours'
        required: false
        default: '6'
      enable_persistence:
        description: 'Enable Persistent User State & Cloud File Sync'
        required: false
        default: 'true'
      pat_token:
        description: 'User GitHub PAT for 100% Guaranteed 24/7 Chaining'
        required: false
        default: ''

permissions:
  actions: write
  contents: write
  statuses: write

jobs:
  run-cloud-pc:
    runs-on: windows-latest
    timeout-minutes: 360 # 6 hours maximum limit on GitHub Actions

    steps:
    - name: 1. Configure High-Performance Windows Cloud Environment
      run: |
        Write-Host "======================================================" -ForegroundColor Cyan
        Write-Host "  TITAN CLOUD WORKSTATION (M11 ENTERPRISE EDITION v0.11)" -ForegroundColor Green
        Write-Host "  Lead Architect: M11 Dev - Mohamed (GitHub: @M11-Developer)" -ForegroundColor Yellow
        Write-Host "  Allocated Hardware: 4 vCPUs / 16GB RAM / 256GB SSD" -ForegroundColor Cyan
        Write-Host "  Engine: 60 FPS DWM Unlocked + Egypt Ultra-Eco Protocol" -ForegroundColor Green
        Write-Host "  License Signature: TITAN-M11-ENT-2026-V011-8F4C-9B21-E37A-992F" -ForegroundColor Magenta
        Write-Host "======================================================" -ForegroundColor Cyan

    - name: 2. Unlock 60 FPS RDP & Disable NLA Restrictions
      run: |
        # 1. Enable RDP Terminal Server in Windows Registry
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        
        # 2. DISABLE NLA (Network Level Authentication) TO PREVENT CONNECTION REFUSAL ON CLIENTS
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 1
        
        # 3. Explicitly Open Windows Firewall for TCP Port 3389 on ALL Profiles
        netsh advfirewall firewall add rule name="Allow RDP 3389" dir=in action=allow protocol=TCP localport=3389
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
        
        # 4. UNLOCK 60 FPS IN RDP (Default Windows RDP is capped at 30 FPS!)
        New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" -Force -ErrorAction SilentlyContinue | Out-Null
        Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations" -Name "DWMFrameRate" -Value 60 -Type DWord -Force -ErrorAction SilentlyContinue
        Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" -Name "DWMFrameRate" -Value 60 -Type DWord -Force -ErrorAction SilentlyContinue
        
        # 5. Hardware Video Acceleration (RemoteFX & AVC444 H.264)
        Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" -Name "SelectTransportProtocol" -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
        Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" -Name "fEnableRemoteFX" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
        Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" -Name "RemoteFX_AVC444" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
        Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" -Name "AVC444Mode" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
        Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" -Name "VisualQuality" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
        Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" -Name "MaxMonitors" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
        
        # 6. Ensure Remote Desktop Service is Running
        Set-Service -Name "TermService" -StartupType Automatic -ErrorAction SilentlyContinue
        Start-Service -Name "TermService" -ErrorAction SilentlyContinue
        
        # 7. Set runneradmin user credentials safely
        $Password = ConvertTo-SecureString "TitanCloud2026!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $Password -ErrorAction SilentlyContinue
        net user runneradmin "TitanCloud2026!" /add 2>$null
        net user runneradmin "TitanCloud2026!"
        Write-Host "RDP 60 FPS Terminal Service successfully unlocked (NLA Disabled)." -ForegroundColor Green

    # =========================================================================
    # STEP 3: RESTORE USER PERSISTENT STATE (DESKTOP FILES, DOCUMENTS, APPS)
    # =========================================================================
    - name: 3. Restore User Persistent State & Desktop Files
      if: github.event.inputs.enable_persistence == 'true'
      run: |
        Write-Host "Checking for existing cloud backup (Persistent State)..." -ForegroundColor Cyan
        try {
          $token = "${{ github.event.inputs.pat_token }}"
          if (-not $token) { $token = "${{ secrets.GITHUB_TOKEN }}" }
          $repo = "${{ github.repository }}"
          $url = "https://api.github.com/repos/$repo/contents/cloud_state.zip?ref=main"
          $headers = @{ "Authorization" = "Bearer $token"; "User-Agent" = "Titan-Sync-v011" }
          $fileMeta = Invoke-RestMethod -Uri $url -Headers $headers -ErrorAction SilentlyContinue
          
          if ($fileMeta -and $fileMeta.download_url) {
            Write-Host "Found cloud state backup! Restoring user files..." -ForegroundColor Green
            curl.exe -fsSL -o "cloud_state.zip" $fileMeta.download_url
            Expand-Archive -Path "cloud_state.zip" -DestinationPath "C:\Users\runneradmin" -Force
            Write-Host "User files and desktop state restored 100%!" -ForegroundColor Green
          } else {
            Write-Host "No prior cloud backup found. Initializing fresh clean workspace." -ForegroundColor Yellow
          }
        } catch {
          Write-Host "State initialization completed."
        }

    # =========================================================================
    # STEP 4A: TAILSCALE WIREGUARD (ZERO CREDIT CARD - ULTRA-LOW LATENCY)
    # =========================================================================
    - name: 4A. Setup Tailscale WireGuard Tunnel (Zero Credit Card)
      if: github.event.inputs.tunnel_provider == 'tailscale'
      run: |
        Write-Host "Installing Tailscale for Windows via direct installer..." -ForegroundColor Cyan
        curl.exe -fsSL "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -o "tailscale-setup.exe"
        Start-Process -FilePath ".\tailscale-setup.exe" -ArgumentList "/quiet /norestart" -Wait
        Start-Sleep -Seconds 6
        Start-Service -Name "Tailscale" -ErrorAction SilentlyContinue

        $tailscalePath = "C:\Program Files\Tailscale\tailscale.exe"
        if (-not (Test-Path $tailscalePath)) {
            $tailscalePath = (Get-Command tailscale.exe -ErrorAction SilentlyContinue).Source
        }
        if (-not $tailscalePath -or -not (Test-Path $tailscalePath)) {
            Write-Host "Fallback to Chocolatey for Tailscale installation..."
            choco install tailscale -y --no-progress
            $tailscalePath = "C:\Program Files\Tailscale\tailscale.exe"
        }

        Write-Host "Authenticating with Tailscale WireGuard Network..." -ForegroundColor Cyan
        $authKey = "${{ github.event.inputs.tunnel_token }}".Trim()
        & $tailscalePath up --authkey=$authKey --hostname=titan-cloud-pc --accept-routes --reset
        Start-Sleep -Seconds 6

        $ip = ""
        for ($i = 0; $i -lt 15; $i++) {
            $ip = (& $tailscalePath ip -4 2>$null).Trim()
            if ($ip -match '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$') { break }
            Start-Sleep -Seconds 3
        }

        if (-not $ip) {
            Write-Error "Failed to obtain Tailscale IPv4 address. Check if your Auth Key is valid."
            exit 1
        }

        Write-Host "======================================================" -ForegroundColor Green
        Write-Host ">>>TITAN_ENDPOINT_START<<<tcp://$($ip):3389>>>TITAN_ENDPOINT_END<<<" -ForegroundColor Green
        Write-Host "TITAN_PROVIDER: TAILSCALE (60 FPS WireGuard P2P)" -ForegroundColor Cyan
        Write-Host "TITAN_IP: $ip" -ForegroundColor Yellow
        Write-Host "TITAN_USER: runneradmin" -ForegroundColor Yellow
        Write-Host "TITAN_PASS: TitanCloud2026!" -ForegroundColor Yellow
        Write-Host "======================================================" -ForegroundColor Green

        $info = @{
          endpoint = "tcp://$($ip):3389"
          provider = "tailscale"
          host = $ip
          port = "3389"
          username = "runneradmin"
          password = "TitanCloud2026!"
          specs = "16GB RAM / 4 vCPUs / 256GB SSD (60 FPS Unlocked)"
          status = "ONLINE"
          author = "M11 Dev - Mohamed"
        } | ConvertTo-Json
        $info | Out-File -FilePath "titan_connect.json" -Encoding utf8

    # =========================================================================
    # STEP 4B: PINGGY DIRECT PUBLIC TUNNEL (ZERO CLIENT INSTALL - ZERO CARD)
    # =========================================================================
    - name: 4B. Setup Pinggy Direct Public Tunnel (Zero Client Install)
      if: github.event.inputs.tunnel_provider == 'pinggy'
      run: |
        Write-Host "Starting Pinggy Instant Public TCP Tunnel..." -ForegroundColor Cyan
        Start-Process -FilePath "ssh" -ArgumentList "-p 443 -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -R0:localhost:3389 tcp@a.pinggy.io" -RedirectStandardOutput "pinggy.log" -RedirectStandardError "pinggy_err.log" -NoNewWindow
        Start-Sleep -Seconds 8

        $publicUrl = $null
        $maxRetries = 15
        $retry = 0
        while ($retry -lt $maxRetries -and -not $publicUrl) {
            if (Test-Path "pinggy.log") {
                $lines = Get-Content "pinggy.log"
                foreach ($line in $lines) {
                    if ($line -match "tcp://([^:\s]+):([0-9]+)") {
                        $publicUrl = $matches[0]
                        $pHost = $matches[1]
                        $pPort = $matches[2]
                        break
                    }
                }
            }
            if (-not $publicUrl) { Start-Sleep -Seconds 2 }
            $retry++
        }

        if (-not $publicUrl) {
            Write-Error "Failed to extract Pinggy tunnel. Check logs:"
            if (Test-Path "pinggy.log") { Get-Content "pinggy.log" }
            if (Test-Path "pinggy_err.log") { Get-Content "pinggy_err.log" }
            exit 1
        }

        Write-Host "======================================================" -ForegroundColor Green
        Write-Host ">>>TITAN_ENDPOINT_START<<<$publicUrl>>>TITAN_ENDPOINT_END<<<" -ForegroundColor Green
        Write-Host "TITAN_PROVIDER: PINGGY (Direct Public Tunnel - No Client Needed)" -ForegroundColor Cyan
        Write-Host "TITAN_HOST: $pHost" -ForegroundColor Yellow
        Write-Host "TITAN_PORT: $pPort" -ForegroundColor Yellow
        Write-Host "TITAN_USER: runneradmin" -ForegroundColor Yellow
        Write-Host "TITAN_PASS: TitanCloud2026!" -ForegroundColor Yellow
        Write-Host "======================================================" -ForegroundColor Green

        $info = @{
          endpoint = $publicUrl
          provider = "pinggy"
          host = $pHost
          port = $pPort
          username = "runneradmin"
          password = "TitanCloud2026!"
          specs = "16GB RAM / 4 vCPUs / 256GB SSD (60 FPS Unlocked)"
          status = "ONLINE"
          author = "M11 Dev - Mohamed"
        } | ConvertTo-Json
        $info | Out-File -FilePath "titan_connect.json" -Encoding utf8

    # =========================================================================
    # STEP 4C: NGROK TUNNEL (FALLBACK)
    # =========================================================================
    - name: 4C. Setup Ngrok Tunnel (Requires Credit Card on Ngrok)
      if: github.event.inputs.tunnel_provider == 'ngrok'
      run: |
        Write-Host "Downloading Ngrok v3 Engine..." -ForegroundColor Cyan
        curl.exe -fsSL -o "ngrok.zip" "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip"
        Expand-Archive -Path "ngrok.zip" -DestinationPath "." -Force

        $cleanToken = "${{ github.event.inputs.tunnel_token }}".Trim()
        .\ngrok.exe config add-authtoken $cleanToken

        Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389 --log=stdout" -RedirectStandardOutput "ngrok.log" -RedirectStandardError "ngrok_err.log" -NoNewWindow
        Start-Sleep -Seconds 8

        $maxRetries = 10
        $retry = 0
        $publicUrl = $null
        while ($retry -lt $maxRetries -and -not $publicUrl) {
            try {
                $tunnels = (Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels" -TimeoutSec 3).tunnels
                if ($tunnels -and $tunnels.Count -gt 0) {
                    $publicUrl = $tunnels[0].public_url
                }
            } catch {
                Start-Sleep -Seconds 3
            }
            $retry++
        }

        if (-not $publicUrl) {
            Write-Error "Failed to extract Ngrok endpoint. Check logs below:"
            if (Test-Path "ngrok.log") { Get-Content "ngrok.log" }
            if (Test-Path "ngrok_err.log") { Get-Content "ngrok_err.log" }
            exit 1
        }

        Write-Host "======================================================" -ForegroundColor Cyan
        Write-Host ">>>TITAN_ENDPOINT_START<<<$publicUrl>>>TITAN_ENDPOINT_END<<<" -ForegroundColor Green
        Write-Host "TITAN_USER: runneradmin" -ForegroundColor Yellow
        Write-Host "TITAN_PASS: TitanCloud2026!" -ForegroundColor Yellow
        Write-Host "======================================================" -ForegroundColor Cyan

        $clean = $publicUrl -replace "tcp://",""
        $parts = $clean -split ":"
        $info = @{
          endpoint = $publicUrl
          provider = "ngrok"
          host = $parts[0]
          port = $parts[1]
          username = "runneradmin"
          password = "TitanCloud2026!"
          specs = "16GB RAM / 4 vCPUs / 256GB SSD (60 FPS Unlocked)"
          status = "ONLINE"
          author = "M11 Dev - Mohamed"
        } | ConvertTo-Json
        $info | Out-File -FilePath "titan_connect.json" -Encoding utf8

    # =========================================================================
    # STEP 5: ARTIFACT UPLOAD & REDUNDANT 24/7 CHAINING LOOP
    # =========================================================================
    - name: 5. Upload Connection Artifact for Titan Client App
      uses: actions/upload-artifact@v4
      with:
        name: titan-endpoint
        path: titan_connect.json
        retention-days: 1

    - name: 6. Session Watchdog & Dual-Guard 24/7 Chaining Daemon
      run: |
        Write-Host "Titan Cloud PC is actively running in Microsoft Datacenter at 60 FPS."
        Write-Host "Lead Developer: M11 Dev - Mohamed | v0.11 Enterprise Ultra"
        
        $token = "${{ github.event.inputs.pat_token }}"
        if (-not $token) { $token = "${{ secrets.GITHUB_TOKEN }}" }
        $repo = "${{ github.repository }}"
        $maxSeconds = 21600 # 6 hours total
        $elapsed = 0
        $backupInterval = 600 # Backup every 10 minutes
        $lastBackup = 0
        $chainTriggered = $false

        while ($elapsed -lt $maxSeconds) {
          Start-Sleep -Seconds 60
          $elapsed += 60

          # Periodic Auto-Backup to Cloud
          if (($elapsed - $lastBackup) -ge $backupInterval) {
            $lastBackup = $elapsed
            Write-Host "Periodic State Sync: Preserving user files to Cloud..." -ForegroundColor Cyan
            try {
              $pathsToSave = @("C:\Users\runneradmin\Desktop", "C:\Users\runneradmin\Documents")
              Compress-Archive -Path $pathsToSave -DestinationPath "cloud_state.zip" -Force -ErrorAction SilentlyContinue
              if (Test-Path "cloud_state.zip") {
                $bytes = [System.IO.File]::ReadAllBytes("cloud_state.zip")
                $b64 = [System.Convert]::ToBase64String($bytes)
                
                $checkUrl = "https://api.github.com/repos/$repo/contents/cloud_state.zip"
                $headers = @{ "Authorization" = "Bearer $token"; "User-Agent" = "Titan-Sync-v011" }
                $sha = $null
                try {
                  $remoteFile = Invoke-RestMethod -Uri $checkUrl -Headers $headers -ErrorAction SilentlyContinue
                  if ($remoteFile -and $remoteFile.sha) { $sha = $remoteFile.sha }
                } catch {}

                $body = @{
                  message = "Titan Cloud Auto-Backup at $($elapsed)s [M11 State Sync]"
                  content = $b64
                }
                if ($sha) { $body["sha"] = $sha }

                Invoke-RestMethod -Uri $checkUrl -Headers $headers -Method Put -Body ($body | ConvertTo-Json) -ErrorAction SilentlyContinue | Out-Null
                Write-Host "Auto-Backup completed! User files secured in cloud." -ForegroundColor Green
              }
            } catch {
              Write-Host "Backup notice: $_"
            }
          }

          # 20 Minutes before 6-hour limit: Trigger Next Runner (Chaining / Never-ending PC)
          if ($elapsed -ge 20400 -and -not $chainTriggered) { # 5h 40m
            $chainTriggered = $true
            Write-Host "SESSION CHAINING: 20 minutes remaining! Dispatching next Cloud PC runner to keep session alive 24/7..." -ForegroundColor Yellow
            try {
              $dispatchUrl = "https://api.github.com/repos/$repo/actions/workflows/titan_cloud_pc.yml/dispatches"
              $dispatchBody = @{
                ref = "main"
                inputs = @{
                  tunnel_provider = "${{ github.event.inputs.tunnel_provider }}"
                  tunnel_token = "${{ github.event.inputs.tunnel_token }}"
                  enable_persistence = "true"
                  pat_token = $token
                }
              } | ConvertTo-Json
              $headers = @{ "Authorization" = "Bearer $token"; "User-Agent" = "Titan-Chaining-v011" }
              Invoke-RestMethod -Uri $dispatchUrl -Headers $headers -Method Post -Body $dispatchBody -ErrorAction SilentlyContinue | Out-Null
              Write-Host "Next runner dispatched! Seamless 24/7 handover initiated." -ForegroundColor Green
            } catch {
              Write-Host "Chaining notice: $_"
            }
          }

          if ($elapsed % 600 -eq 0) {
            Write-Host "Cloud PC Heartbeat: $elapsed / $maxSeconds seconds active (60 FPS Stream Healthy)."
          }
        }
